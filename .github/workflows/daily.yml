name: daily-pipeline

on:
  schedule:
    # 00:00 UTC is 18:00 in Mexico City, after the FIX (from 12:00), the target rate (Thursdays 13:00)
    # and the H.15 release (weekdays 4:15 pm US Eastern, 20:15 UTC in October). Scheduled runs are best effort.
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python run_pipeline.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BANXICO_TOKEN: ${{ secrets.BANXICO_TOKEN }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
